<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="me-stage" style="flex-direction:column">
  <div class="me-row">
    <button class="me-btn me-btn-primary">Play</button>
    <button class="me-btn">How to play</button>
    <button class="me-btn me-btn-danger">Reset progress</button>
    <button class="me-btn me-btn-gold">Save to my NFT</button>
    <button class="me-btn" disabled>Wallet</button>
  </div>
  <div class="me-row">
    <span class="me-caption" style="width:72px">States</span>
    <button class="me-btn me-btn-primary is-focus">Focus</button>
    <button class="me-btn me-btn-primary is-pressed">Pressed</button>
    <button class="me-btn is-focus">Focus</button>
    <button class="me-btn is-pressed">Pressed</button>
  </div>
  <div class="me-row">
    <span class="me-caption" style="width:72px">Sizes</span>
    <button class="me-btn me-btn-sm">Back</button>
    <button class="me-btn me-btn-icon" aria-label="Previous"><i class="me-arrow is-left"></i></button>
    <button class="me-btn me-btn-icon" aria-label="Next"><i class="me-arrow"></i></button>
    <button class="me-btn me-btn-icon" aria-label="Pause"><span class="me-pause-bars"><i></i><i></i></span></button>
  </div>
</div>
</body>
</html>
