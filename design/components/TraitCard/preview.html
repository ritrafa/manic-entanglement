<!-- @dsCard group="Wardrobe" height=240 subtitle="Equipped, unlocked, new, locked (find), locked (feat)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TraitCard</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="me-stage">
  <button class="me-trait me-notch is-equipped" aria-pressed="true">
    <div class="me-sprite"><img class="is-ghost" src="/_blob/23ee92916807e3d0035e5a8195ffc2a2" alt=""><img src="/_blob/cca0837c2cac366a1cee4636274256da" alt=""></div>
    <span class="me-trait-name">Hood</span>
    <span class="me-trait-meta"><span class="me-tag is-equipped">On</span><span class="me-pips is-found" aria-label="Found"><i></i><i></i><i></i></span></span>
  </button>

  <button class="me-trait me-notch" aria-pressed="false">
    <div class="me-sprite"><img class="is-ghost" src="/_blob/23ee92916807e3d0035e5a8195ffc2a2" alt=""><img src="/_blob/94e8d5672b5a701159a890e5b4039d1c" alt=""></div>
    <span class="me-trait-name">Cowboy</span>
    <span class="me-trait-meta"><span class="me-label">Head</span><span class="me-pips is-found" aria-label="Found"><i></i><i></i><i></i></span></span>
  </button>

  <button class="me-trait me-notch is-new" aria-pressed="false">
    <div class="me-sprite"><img class="is-ghost" src="/_blob/23ee92916807e3d0035e5a8195ffc2a2" alt=""><img src="/_blob/e06fcbe170a28861a2d7b364b31d7c14" alt=""></div>
    <span class="me-trait-name">Crown</span>
    <span class="me-trait-meta"><span class="me-tag is-new">New</span><span class="me-pips is-rare" aria-label="Rare"><i></i><i></i><i></i></span></span>
  </button>

  <div class="me-trait me-notch is-locked" aria-disabled="true">
    <div class="me-sprite is-locked"><img src="/_blob/23ee92916807e3d0035e5a8195ffc2a2" alt=""><img src="/_blob/377c3eb8051089f297465a4ab200b861" alt=""></div>
    <span class="me-trait-name">Wings</span>
    <span class="me-trait-meta"><span class="me-tag is-locked">Locked</span><span class="me-pips is-rare" aria-label="Rare"><i></i><i></i><i></i></span></span>
    <span class="me-hint">Find it in the maze</span>
  </div>

  <div class="me-trait me-notch is-locked" aria-disabled="true">
    <div class="me-sprite is-locked"><img src="/_blob/23ee92916807e3d0035e5a8195ffc2a2" alt=""><img src="/_blob/c956480acc1e89f1ec797ef8fee84bdb" alt=""></div>
    <span class="me-trait-name">Jetpack</span>
    <span class="me-trait-meta"><span class="me-tag is-locked">Locked</span><span class="me-pips is-feat" aria-label="Feat only"><i></i><i></i><i></i></span></span>
    <span class="me-hint me-feat">Feat: Sprinter</span>
  </div>
</div>
</body>
</html>
